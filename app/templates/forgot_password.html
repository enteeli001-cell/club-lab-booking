{% extends "base.html" %}
{% block title %}{{ t("重置密码") }} · {{ t(system_name) }}{% endblock %}
{% block content %}
<div class="login-box card login-box-wide">
  <h1 class="login-title">{{ t("重置密码") }}</h1>
  <p class="hint">{{ t("请填写本人姓名、学号，以及任意一名队友的姓名和学号。全部匹配后可设置符合规则的新密码。验证失败只提示“信息不匹配”。系统不提供管理员密码自助找回。") }}</p>
  <form method="post" data-busy="{{ t('正在验证…') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <div class="field">
      <label for="name">{{ t("本人姓名") }}</label>
      <input id="name" name="name" type="text" required value="{{ form.name }}">
    </div>
    <div class="field">
      <label for="student_id">{{ t("本人学号") }}</label>
      <input id="student_id" name="student_id" type="text" inputmode="text" autocapitalize="off" spellcheck="false" required value="{{ form.student_id }}">
    </div>
    <div class="field">
      <label for="teammate_name">{{ t("一名队友的姓名") }}</label>
      <input id="teammate_name" name="teammate_name" type="text" required value="{{ form.teammate_name }}">
    </div>
    <div class="field">
      <label for="teammate_student_id">{{ t("该队友的学号") }}</label>
      <input id="teammate_student_id" name="teammate_student_id" type="text" required value="{{ form.teammate_student_id }}">
    </div>
    <div class="field">
      <label for="new_password">{{ t("新密码（至少 6 位，须含大小写字母和特殊符号，且不能等于学号）") }}</label>
      <div class="pw-toggle-wrap">
        <input id="new_password" name="new_password" type="password" required minlength="6" autocomplete="new-password">
        <button type="button" class="pw-toggle" aria-controls="new_password" aria-pressed="false" aria-label="{{ t('显示密码') }}">{{ t("显示") }}</button>
      </div>
    </div>
    <div class="field">
      <label for="confirm_password">{{ t("确认新密码") }}</label>
      <div class="pw-toggle-wrap">
        <input id="confirm_password" name="confirm_password" type="password" required minlength="6" autocomplete="new-password">
        <button type="button" class="pw-toggle" aria-controls="confirm_password" aria-pressed="false" aria-label="{{ t('显示密码') }}">{{ t("显示") }}</button>
      </div>
    </div>
    <button type="submit">{{ t("验证并重置密码") }}</button>
  </form>
  <a class="admin-login-link" href="{{ url_for('auth.login', next=next_url) if next_url else url_for('auth.login') }}">{{ t("返回登录") }}</a>
</div>
{% endblock %}
