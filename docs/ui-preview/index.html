<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>界面离线预览</title><style>body{font:15px sans-serif;background:#e9eef5;color:#193354;margin:24px}h1{font-size:24px}select,button{font:inherit;padding:10px;margin:4px}iframe{border:1px solid #b9cadf;background:#fff;height:900px;display:block;margin-top:20px}p{line-height:1.8}.canvas{overflow:auto}</style><h1>桌面与手机界面离线预览</h1><p>由真实 Flask 模板与隔离演示数据生成。这是 HTML 预览，不是已验收的浏览器截图；表单不会提交。实际像素效果和操作流程仍需在可启动 Chromium 的环境运行 capture_ui.py 验证。</p><select id="page"><option value="login">参赛队长登录</option><option value="captain">队长工作台</option><option value="booking">测试预约</option><option value="records">申请记录</option><option value="tools">工具借用</option><option value="schedule">占用视图</option><option value="reviewer">管理员工作台</option><option value="admin">总管理员工作台</option><option value="review">申请审核</option><option value="inventory">工具记录与库存</option><option value="people">人员信息管理</option><option value="managers">管理员管理</option><option value="security">安全防护中心</option></select><button onclick="resize(1280)">电脑 1280px</button><button onclick="resize(390)">手机 390px</button><button onclick="resize(320)">手机 320px</button><div class="canvas"><iframe id="preview" title="页面预览" src="login.html" width="1280"></iframe></div><script>var frame=document.getElementById('preview');document.getElementById('page').onchange=function(){frame.src=this.value+'.html'};function resize(width){frame.width=width;}</script></html>
